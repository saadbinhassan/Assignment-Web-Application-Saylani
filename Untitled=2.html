<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

<h2>My Feedback Form </h2>
<form>
    <table>
        <ul>
            <li>
                Name: <input type="text" placeholder="Enter your name">
            </li>
                <li>
                    Email: <input type="email" placeholder="Enter your email">
                </li>
                <li>
                    Password:<input type ="password"placeholder="Enter Your Password">
                </li>
                <br>
                <li>
                Please Check all the emotion that apply to you:
                </li>
                <ul>
                    <li>
                        <label for="Angry">Angry</label> 
                        <input type="checkbox" name="Angry" id="Angry" value="Angry">
                </li>
                    <li>
                        <label for="sad">Sad</label>
                        <input type="checkbox" name="sad" id="sad" value="Sad">
                  </li>
                  <li>
                      <label for="Happy">Happy</label>
                      <input type="checkbox" name="Happy" id="Happy" value="Happy">
                  </li>
                    <li>
                        <label for="Ambivalent">Ambivalent</label>
                        <input type="checkbox" name="Ambivalent" id="Ambivalent" value="Ambivalent">
                    </li>
                       </ul> 
                         <br>
                         <li>
                           How satisfied were you with our service?
                            </li>
                            <ul>
                                <li>
                                    <label for="Very satisfied">Very satisfied</label>
                                        <input type="radio" name="satisfaction" id="Very satisfied">
                                    </li>
                                    <li>
                                        <label for="Satisfied">Satisfied</label>
                                        <input type="radio" name="satisfaction" id="Satisfied">
                                        </li>
                                         <li>
                                    <label for="Didn't care">Didn't care</label>
                                    <input type="radio" name="satisfaction" id="Didn't care">
                                    </li>
                                    <li>
                                        <label for="Dissatisfied">Dissatisfied</label>
                                        <input type="radio" name="satisfaction" id="Dissatisfied">
                                        </li>
                                        </ul>
                                        <br>
                                            <li>
                                                Further comments:
                                                <textarea rows="3" cols="20"></textarea>
                                                
                                            </li>
                                            <br>
                                            <li>
                                            Bio photo:
                                            <input type="file"> 
                                            </li>
                                        <br>
                                        <li>
                                            Location Visited 
                                            <select >
                                                <option disabled>"Select Location"</option></locked>
                                                <option>Karachi</option>
                                                <option>Lahore</option>
                                                <option>Islamabad</option>
                                                <option>Peshaware</option>
                                                <option>Multan</option>
                                                <option>Quetta</option>
                                            </select>
                                        </li>
                                                <li>
                                                    <button type="submit">Submit</button>
                                                </li>                             
                                    </ul>



                
            
                
    </table>
</form>













</body>
</html>
